name: Worker APK

# Builds the RosterBay worker app and republishes it to one fixed release tag,
# so `…/releases/download/worker-app/rosterbay-worker.apk` is a permanent URL
# that always serves the newest build. The landing page links at that URL via
# a redirect, which is why the link never has to be touched again.
#
# Runs whenever mobile code lands on main — an admin-only commit doesn't change
# the APK, so it doesn't spend a 20-minute build. Use "Run workflow" to force
# one (that's also how the very first release gets created).

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/worker-apk.yml'
  workflow_dispatch:

# One build at a time; a newer commit supersedes an in-flight one.
concurrency:
  group: worker-apk
  cancel-in-progress: true

permissions:
  contents: write # create/update the release and its asset

env:
  RELEASE_TAG: worker-app
  APK_NAME: rosterbay-worker.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The demo backend, baked into the bundle. babel-preset-expo inlines every
    # `process.env.EXPO_PUBLIC_*` reference at transform time, so these have to
    # be present for the whole job, not just the gradle step.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Require the Supabase secrets
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Repo secrets SUPABASE_URL / SUPABASE_ANON_KEY are missing. Without them the APK builds but throws on launch — see DEPLOY.md §3."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 17, not 21: the React Native gradle plugin pins a Java 17 toolchain and
      # Gradle matches toolchains on the exact major version.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      # app.json carries the marketing version; the run number makes each build
      # distinguishable and keeps versionCode climbing, so re-installing over an
      # older sideloaded copy is an upgrade rather than a conflict.
      - name: Stamp the build number
        working-directory: mobile
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          sed -i -E "s/versionCode +[0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName +\"[^\"]+\"/versionName \"${version}+${{ github.run_number }}\"/" android/app/build.gradle
          echo "APP_VERSION=${version}+${{ github.run_number }}" >> "$GITHUB_ENV"
          grep -nE 'version(Code|Name)' android/app/build.gradle

      # Signed with the debug keystore prebuild generates — Expo's stock release
      # config. Fine for a sideloaded demo; it is not a Play Store upload key.
      - name: Assemble release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage the artifact
        run: |
          src=mobile/android/app/build/outputs/apk/release/app-release.apk
          size=$(stat -c%s "$src")
          echo "APK is $((size / 1048576)) MB"
          # A release APK that small means the JS bundle or the native libs
          # silently didn't make it in; better to fail than to publish it.
          if [ "$size" -lt 10000000 ]; then
            echo "::error::APK is only ${size} bytes — refusing to publish."
            exit 1
          fi
          mv "$src" "$APK_NAME"

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          notes=$(cat <<EOF
          The RosterBay worker app for Android — the field side of the demo.

          - **Version** \`$APP_VERSION\`
          - **Commit** \`$COMMIT\`
          - **Built** $(date -u '+%Y-%m-%d %H:%M UTC')

          **Install:** open [rosterbay.com/download/worker-app.apk](https://rosterbay.com/download/worker-app.apk)
          on an Android phone and allow installs from your browser when prompted.
          Sign-in is pre-filled with the demo worker (Liam) — tap *Use demo worker*.

          Signed with a debug keystore, so Android warns that the developer is
          unverified. Demo data resets nightly.

          _Published automatically by the Worker APK workflow. This tag always holds
          the newest build, which is why the download link never has to change._
          EOF
          )
          title="Worker app · $APP_VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" --target "$COMMIT" --title "$title" --notes "$notes"
          fi
          gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber

          echo "### Worker APK published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$APP_VERSION\` → https://rosterbay.com/download/worker-app.apk" >> "$GITHUB_STEP_SUMMARY"
